name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar o executável
        shell: pwsh
        run: ./tools/installer/build.ps1 -OutputDirectory ./dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: dist/*.exe

      - name: Montar o pacote da release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/*.exe pkg/
          Copy-Item README.md, RELEASE_NOTES_v2.5.9.md pkg/
          Copy-Item 2.0.1 pkg/2.0.1 -Recurse
          Compress-Archive -Path pkg/* -DestinationPath Pokemon-Pokopia-PT-BR-v2.5.9.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Pokemon-Pokopia-PT-BR-v2.5.9.zip
